<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Interview System</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🤖 AI Interview System</h1>
      <p>Automated technical interview platform powered by LLaMA 3</p>
    </header>

    <main class="card">
      <h2>Candidate Registration</h2>
      <p class="subtitle">Fill in your details to begin the AI-conducted interview.</p>

      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="e.g. Priya Nair" />
      </div>
      <div class="form-group">
        <label for="role">Role Applied For</label>
        <input type="text" id="role" placeholder="e.g. Python Backend Developer" />
      </div>
      <div class="form-group">
        <label for="qualification">Qualification</label>
        <input type="text" id="qualification" placeholder="e.g. B.Tech Computer Science, 2023" />
      </div>
      <div class="form-group">
        <label for="experience">Experience</label>
        <input type="text" id="experience" placeholder="e.g. 1 year internship" />
      </div>
      <div class="form-group">
        <label for="skills">Skills <span style="font-weight:400;color:#64748b">(comma-separated)</span></label>
        <input type="text" id="skills" placeholder="e.g. Python, FastAPI, PostgreSQL, Docker" />
      </div>

      <div id="error-msg" class="error hidden"></div>

      <button id="start-btn" class="btn btn-primary" onclick="startInterview()" style="width:100%;margin-top:0.5rem">
        Start Interview →
      </button>
    </main>
  </div>

  <script src="/static/js/register.js"></script>
</body>
</html>
