<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Interview — In Progress</title>
  <link rel="stylesheet" href="/static/css/interview.css" />
</head>
<body>
  <div class="interview-layout">

    <!-- Left Panel: Candidate Details -->
    <aside class="candidate-panel">
      <div class="panel-header">
        <div class="avatar">👤</div>
        <h2 id="candidate-name">Loading...</h2>
        <span class="status-badge">Interview In Progress</span>
      </div>
      <div class="panel-details">
        <div class="detail-item">
          <span class="detail-label">Role</span>
          <span class="detail-value" id="candidate-role">—</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Qualification</span>
          <span class="detail-value" id="candidate-qualification">—</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Experience</span>
          <span class="detail-value" id="candidate-experience">—</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Skills</span>
          <span class="detail-value" id="candidate-skills">—</span>
        </div>
      </div>
      <div class="progress-section">
        <div class="progress-label">
          <span>Progress</span>
          <span id="question-counter">0 / 5</span>
        </div>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill" style="width:0%"></div>
        </div>
      </div>
    </aside>

    <!-- Right Side: Chat Window -->
    <main class="chat-section">

      <!-- Chat messages area -->
      <div class="chat-window" id="chat-window">
        <div class="chat-welcome">
          <p>🤖 Interview starting, please wait...</p>
        </div>
      </div>

      <!-- Bottom input area -->
      <div class="chat-input-area">

        <!-- Transcript preview -->
        <div id="transcript-box" class="transcript-box hidden">
          <p id="transcript-text"></p>
          <button class="btn-rerecord" onclick="clearRecording()">🔄 Re-record</button>
        </div>

        <!-- Controls -->
        <div class="input-controls">
          <button id="mic-btn" class="mic-btn" onclick="toggleRecording()">
            🎤
          </button>
          <div class="mic-label-wrap">
            <span id="mic-label">Press mic to record your answer</span>
            <div id="recording-indicator" class="recording-indicator hidden">
              <span class="rec-dot"></span> Recording...
            </div>
          </div>
          <button id="send-btn" class="send-btn hidden" onclick="submitAnswer()">
            SEND
          </button>
        </div>

      </div>
    </main>

  </div>

  <script src="/static/js/interview.js"></script>
</body>
</html>
