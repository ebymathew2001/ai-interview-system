<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview — In Progress</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🤖 AI Interview System</h1>
      <div id="progress-bar-wrapper">
        <div class="progress-label">
          <span id="question-counter">Loading...</span>
          <span id="status-text"></span>
        </div>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill" style="width:0%"></div>
        </div>
      </div>
    </header>

    <main class="card interview-card">
      <!-- Loading -->
      <div id="loading-state">
        <div class="spinner"></div>
        <p>Preparing your interview...</p>
      </div>

      <!-- Active question -->
      <div id="question-state" class="hidden">
        <div class="question-box">
          <div class="question-label">Question <span id="q-num"></span></div>
          <p id="question-text" class="question-text"></p>
        </div>

        <div id="mic-status" class="mic-status idle">
          <span class="mic-icon">🎙️</span>
          <span id="mic-label">Press to speak your answer</span>
        </div>

        <button id="record-btn" class="btn btn-record" onclick="toggleRecording()">
          🎤 Start Recording
        </button>

        <div id="transcript-preview" class="transcript-preview hidden">
          <label>Your answer (transcribed):</label>
          <p id="transcript-text"></p>
          <button class="btn btn-secondary" onclick="clearAnswer()" style="font-size:0.85rem;padding:0.4rem 0.9rem">
            🔄 Re-record
          </button>
        </div>

        <div id="submit-area" class="hidden">
          <button id="submit-btn" class="btn btn-primary" onclick="submitAnswer()" style="width:100%">
            Submit Answer →
          </button>
        </div>
      </div>

      <!-- Evaluating -->
      <div id="evaluating-state" class="hidden">
        <div class="spinner"></div>
        <p>Evaluating your answer...</p>
      </div>

      <!-- Complete -->
      <div id="complete-state" class="hidden">
        <div class="complete-icon">✅</div>
        <h2>Interview Complete!</h2>
        <p>Generating your evaluation report...</p>
        <div class="spinner" style="margin-top:1rem"></div>
      </div>
    </main>
  </div>

  <script src="/static/js/interview.js"></script>
</body>
</html>
